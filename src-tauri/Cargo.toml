[package]
name = "eduwork-tools"
version = "0.1.0"
description = "교육 업무를 위한 로컬 파일 작업 도구 모음"
authors = ["EduWork Tools"]
edition = "2021"

[lib]
name = "eduwork_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
rust_xlsxwriter = "0.101.0"
calamine = "0.37.0"
csv = "1.3"
zip = { version = "2.2.3", default-features = false, features = ["deflate"] }
tempfile = "3.27.0"
regex = "1"
quick-xml = "0.38"
url = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
webp = "0.3"
lopdf = "0.46.0"
printpdf = { version = "0.12.8", default-features = false, features = ["images", "jpeg", "png", "webp"] }

[dev-dependencies]
zip = { version = "2.2.3", default-features = false, features = ["deflate"] }
tempfile = "3.27.0"
